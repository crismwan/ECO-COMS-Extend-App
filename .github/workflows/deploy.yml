name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          echo "Downloading WDCLI from release assets..."
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          echo "Extracting WDCLI..."
          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          # Locate the wdcli binary (extracts to wdcli/bin/wdcli)
          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            find /opt/wdcli -type f | head -20
            exit 1
          fi
          echo "Found wdcli at: ${WDCLI_BIN}"
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Verify WDCLI
        run: wdcli version

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli auth login --system-user
          wdcli whoami

      - name: Deploy to ubc_wcpdev2
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}" --latest-version
