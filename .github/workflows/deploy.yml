name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          echo "Working directory: $(pwd)"
          echo "=== Files to upload ==="
          find presentation -type f | sort
          echo "=== MD5 of key files ==="
          md5sum presentation/hubLanding.pmd presentation/pods/ubcLogo.pod presentation/pods/ecoComsFooter.pod
          echo "=== Running wdcli app upload ==="
          wdcli app upload 2>&1 | tee /tmp/upload-output.txt
          echo "Upload exit code: $?"
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt

      - name: Authenticate to tenant as system user
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          echo "=== wdcli tenant login --help ==="
          wdcli tenant login --help 2>&1 || true
          echo "=== Attempting wdcli tenant login --system-user ==="
          wdcli tenant login --system-user "${TENANT_ALIAS}" 2>&1 || true
          echo "=== wdcli tenant token (to verify) ==="
          wdcli tenant token 2>&1 || true

      - name: Deploy to ubc_wcpdev2
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          echo "=== Running wdcli app deploy ==="
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}" --latest-version 2>&1 | tee /tmp/deploy-output.txt
          echo "Deploy exit code: $?"
          echo "=== Deploy output ==="
          cat /tmp/deploy-output.txt
