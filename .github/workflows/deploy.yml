name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli app upload

      - name: Inject tenant token into WDCLI config
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WD_TENANT_TOKEN: ${{ secrets.WD_TENANT_TOKEN }}
        run: |
          # WCP tenant tokens are issued by WCP auth (api.us.wcp.workday.com/auth) via a
          # browser-based PKCE flow — there is no machine-to-machine path in WDCLI v1.9.43.
          #
          # To refresh this token:
          #   1. On your local machine: wdcli tenant login --tenant-alias ubc_wcpdev2
          #   2. Copy the token:
          #        python3 -c "import json; c=json.load(open('~/.config/@workday/wdcli/config.json'.replace('~', __import__('os').path.expanduser('~')))); print(c['wcpTenantAccessToken']['ubc_wcpdev2'])"
          #   3. Update the WD_TENANT_TOKEN secret in GitHub repo settings.
          #
          # Tokens typically expire after 24 hours; update the secret before each deploy
          # or whenever the "Deploy to ubc_wcpdev2" step fails with an auth error.

          if [ -z "${WD_TENANT_TOKEN}" ]; then
            echo "ERROR: WD_TENANT_TOKEN secret is not set."
            echo "Run 'wdcli tenant login --tenant-alias ubc_wcpdev2' locally and store the"
            echo "resulting token from ~/.config/@workday/wdcli/config.json as the WD_TENANT_TOKEN secret."
            exit 1
          fi

          CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          CONFIG_FILE="${CONFIG_DIR}/config.json"
          mkdir -p "${CONFIG_DIR}"

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "{}" > "${CONFIG_FILE}"
          fi

          WD_TENANT_TOKEN="${WD_TENANT_TOKEN}" TENANT_ALIAS="${TENANT_ALIAS}" \
          python3 - "${CONFIG_FILE}" << 'PYEOF'
import sys, json, os
config_file = sys.argv[1]
token = os.environ["WD_TENANT_TOKEN"]
alias = os.environ["TENANT_ALIAS"]
with open(config_file) as f:
    config = json.load(f)
existing = config.get("wcpTenantAccessToken", {})
if not isinstance(existing, dict):
    existing = {}
existing[alias] = token
config["wcpTenantAccessToken"] = existing
with open(config_file, "w") as f:
    json.dump(config, f)
print(f"Tenant token injected for alias: {alias}")
PYEOF

      - name: Deploy to ubc_wcpdev2
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}" --latest-version
