name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli app upload

      - name: Get tenant access token via ISU client credentials
        env:
          TENANT_ALIAS: ubc_wcpdev2
          ISU_CLIENT_ID: ${{ secrets.WD_ISU_CLIENT_ID }}
          ISU_CLIENT_SECRET: ${{ secrets.WD_ISU_CLIENT_SECRET }}
        run: |
          # Validate secrets are present
          if [ -z "${ISU_CLIENT_ID}" ]; then
            echo "ERROR: WD_ISU_CLIENT_ID secret is not set"
            echo "## ISU Token Failure: Missing secret WD_ISU_CLIENT_ID" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ -z "${ISU_CLIENT_SECRET}" ]; then
            echo "ERROR: WD_ISU_CLIENT_SECRET secret is not set"
            echo "## ISU Token Failure: Missing secret WD_ISU_CLIENT_SECRET" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "ISU_CLIENT_ID is set (length: ${#ISU_CLIENT_ID})"

          # Obtain a tenant access token using the ISU API client (client_credentials grant)
          # Workday OAuth2 endpoint: https://wd2-impl-services1.workday.com/ccx/oauth2/<tenant>/token
          HTTP_STATUS=$(curl -s -o /tmp/token_response.json -w "%{http_code}" -X POST \
            "https://wd2-impl-services1.workday.com/ccx/oauth2/${TENANT_ALIAS}/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${ISU_CLIENT_ID}:${ISU_CLIENT_SECRET}" \
            -d "grant_type=client_credentials")

          echo "HTTP status: ${HTTP_STATUS}"
          TOKEN_RESPONSE=$(cat /tmp/token_response.json)

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: OAuth2 token request failed with HTTP ${HTTP_STATUS}"
            echo "Response: ${TOKEN_RESPONSE}"
            # Write to GitHub step summary so it's visible in API
            echo "## ISU Token Failure" >> $GITHUB_STEP_SUMMARY
            echo "HTTP Status: ${HTTP_STATUS}" >> $GITHUB_STEP_SUMMARY
            echo "Response: \`${TOKEN_RESPONSE}\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          TENANT_TOKEN=$(echo "${TOKEN_RESPONSE}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['access_token'])" 2>/dev/null || echo "")

          if [ -z "${TENANT_TOKEN}" ]; then
            echo "ERROR: Failed to obtain tenant access token"
            echo "Response: ${TOKEN_RESPONSE}"
            exit 1
          fi

          # Write the tenant token into WDCLI config so wdcli app deploy can use it
          CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          CONFIG_FILE="${CONFIG_DIR}/config.json"
          mkdir -p "${CONFIG_DIR}"

          # Read existing config or start fresh, then inject tenant token
          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "{}" > "${CONFIG_FILE}"
          fi

          TENANT_TOKEN="${TENANT_TOKEN}" TENANT_ALIAS="${TENANT_ALIAS}" \
          python3 - "${CONFIG_FILE}" << 'PYEOF'
          import sys, json, os
          config_file = sys.argv[1]
          token = os.environ["TENANT_TOKEN"]
          alias = os.environ["TENANT_ALIAS"]
          with open(config_file) as f:
              config = json.load(f)
          existing = config.get("wcpTenantAccessToken", {})
          if not isinstance(existing, dict):
              existing = {}
          existing[alias] = token
          config["wcpTenantAccessToken"] = existing
          with open(config_file, "w") as f:
              json.dump(config, f)
          PYEOF

          echo "Tenant token written to WDCLI config for ${TENANT_ALIAS}"

      - name: Deploy to ubc_wcpdev2
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}" --latest-version
