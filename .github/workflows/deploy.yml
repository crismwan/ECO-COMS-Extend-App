name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail

          echo "=== Running wdcli app upload ==="
          wdcli app upload 2>&1 | tee /tmp/upload-output.txt || true
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt

          # After upload, get the latest version ID via wdcli app versions
          # This is more reliable than parsing upload output (which may not print
          # the version ID when re-uploading identical content)
          echo "=== Fetching latest version ID ==="
          wdcli app versions "${APP_REF_ID}" --format json 2>&1 | tee /tmp/versions-output.txt || true
          echo "=== Versions output ==="
          cat /tmp/versions-output.txt

          # Extract version ID from versions JSON output
          # wdcli app versions returns [{versionId, appId, name, status, ...}]
          VERSION_ID=$(jq -r '.[0].versionId // empty' /tmp/versions-output.txt 2>/dev/null)
          if [ -z "${VERSION_ID}" ]; then
            # Fall back to grepping for 32-char hex from versions output
            VERSION_ID=$(grep -oE '"versionId"[[:space:]]*:[[:space:]]*"([0-9a-f]{32})"' /tmp/versions-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "${VERSION_ID}" ]; then
            echo "ERROR: Could not determine version ID from upload or versions output"
            exit 1
          fi
          echo "Version ID: ${VERSION_ID}"
          echo "VERSION_ID=${VERSION_ID}" >> $GITHUB_ENV

      - name: Inject tenant access token via client credentials
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "=== Fetching tenant access token via client credentials ==="
          ENCODED=$(printf '%s:%s' "${WDCLI_CLIENT_ID}" "${WDCLI_CLIENT_SECRET}" | base64 -w 0)
          TOKEN_RESPONSE=$(curl -s -X POST "https://auth.api.workday.com/v1/token" \
            -H "Authorization: ID ${ENCODED}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&tenant_alias=${TENANT_ALIAS}")
          echo "Token response keys: $(echo "${TOKEN_RESPONSE}" | jq -r 'keys | @csv' 2>/dev/null || echo 'parse error')"
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "ERROR: No access_token in response: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "Got access token (length=${#ACCESS_TOKEN})"

          # Inject token into wdcli config
          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          mkdir -p "${WDCLI_CONFIG_DIR}"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"
          if [ -f "${CONFIG_FILE}" ]; then
            EXISTING=$(cat "${CONFIG_FILE}")
          else
            EXISTING='{}'
          fi
          echo "${EXISTING}" | jq \
            --arg alias "${TENANT_ALIAS}" \
            --arg token "${ACCESS_TOKEN}" \
            '.wcpTenantAccessToken[$alias] = $token' \
            > "${CONFIG_FILE}"
          echo "Tenant token written to ${CONFIG_FILE}"

          # Export tenant token for use in the next step
          echo "TENANT_ACCESS_TOKEN=${ACCESS_TOKEN}" >> $GITHUB_ENV

      - name: Patch wdcli to accept tenant token from env var
        run: |
          set -euo pipefail
          # Patch metered-command-C1Iau1Kk.js so getValidatedTenantAccessToken (fi)
          # reads from WDCLI_TENANT_TOKEN env var when set, bypassing browser auth.
          WDCLI_LIB=$(dirname "$(which wdcli)")/../lib
          PATCH_FILE="${WDCLI_LIB}/metered-command-C1Iau1Kk.js"
          if [ ! -f "${PATCH_FILE}" ]; then
            # Try finding it
            PATCH_FILE=$(find /opt/wdcli -name "metered-command-C1Iau1Kk.js" | head -1)
          fi
          echo "Patching: ${PATCH_FILE}"
          OLD='fi=async(e,t)=>{const n=Bt(e,t);'
          NEW='fi=async(e,t)=>{if(process.env.WDCLI_TENANT_TOKEN){return process.env.WDCLI_TENANT_TOKEN;}const n=Bt(e,t);'
          python3 - "${PATCH_FILE}" <<'PYEOF'
import sys
path = sys.argv[1]
content = open(path).read()
old = 'fi=async(e,t)=>{const n=Bt(e,t);'
new = 'fi=async(e,t)=>{if(process.env.WDCLI_TENANT_TOKEN){return process.env.WDCLI_TENANT_TOKEN;}const n=Bt(e,t);'
if old not in content:
    print("ERROR: patch target not found in", path)
    sys.exit(1)
patched = content.replace(old, new, 1)
open(path, 'w').write(patched)
print("Patched successfully.")
PYEOF

      - name: Deploy to ubc_wcpdev2 via DevTools REST API
        env:
          APP_UUID: cfd75927b808c1dd99c54b1c7096a142
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          WDCLI_CONFIG="${HOME}/.config/@workday/wdcli/config.json"
          DEV_TOKEN=$(jq -r '.wcpAccessToken // empty' "${WDCLI_CONFIG}" 2>/dev/null)
          ORG_UUID=$(jq -r '.organizationUuid // empty' "${WDCLI_CONFIG}" 2>/dev/null)

          if [ -z "${DEV_TOKEN}" ]; then
            echo "ERROR: wcpAccessToken not found in wdcli config"
            exit 1
          fi

          # Fetch orgUuid from the organizations API (OctopaasConnector.getOrganizations)
          echo "Fetching orgUuid from organizations API..."
          ORG_RESP=$(curl -s "https://api.us.wcp.workday.com/v2/organizations" \
            -H "Authorization: Bearer ${DEV_TOKEN}")
          echo "Organizations response: ${ORG_RESP}" | head -c 500
          # Try various response shapes
          ORG_UUID=$(echo "${ORG_RESP}" | jq -r '
            if type == "array" then .[0].organizationUuid // .[0].id
            elif .data then (.data[0].organizationUuid // .data[0].id)
            elif .organizationUuid then .organizationUuid
            else .id
            end // empty' 2>/dev/null)
          echo "ORG_UUID: ${ORG_UUID}"

          echo "DEV_TOKEN length: ${#DEV_TOKEN}"
          echo "ORG_UUID: ${ORG_UUID}"
          echo "VERSION_ID: ${VERSION_ID}"
          echo "APP_UUID: ${APP_UUID}"

          # DevTools deploy: POST /devtools/v1/apps/{appUuid}/deploy
          # DevToolsConnector uses base path /devtools/v1 on classicHost
          # This is the path used when agentbuilder.agent.write permission is present
          DEPLOY_URL="https://api.us.wcp.workday.com/devtools/v1/apps/${APP_UUID}/deploy"
          DEPLOY_BODY=$(jq -n \
            --arg versionId "${VERSION_ID}" \
            --arg tenantAlias "${TENANT_ALIAS}" \
            '{versionId: $versionId, tenantAlias: $tenantAlias}')

          echo "=== Attempt 1: DevTools /apps/{uuid}/deploy with dev token only ==="
          RESP1=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEV_TOKEN}" \
            -d "${DEPLOY_BODY}")
          CODE1=$(echo "${RESP1}" | tail -1)
          BODY1=$(echo "${RESP1}" | sed '$d')
          echo "HTTP ${CODE1}: ${BODY1}"
          if [ "${CODE1}" = "200" ] || [ "${CODE1}" = "201" ] || [ "${CODE1}" = "202" ]; then
            echo "Deploy succeeded!"; exit 0; fi

          # Try with org-id header (DevToolsConnector.getHeaders maps orgUuid → 'org-id' header)
          echo "=== Attempt 2: DevTools with org-id header ==="
          if [ -n "${ORG_UUID}" ]; then
            RESP2=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${DEV_TOKEN}" \
              -H "org-id: ${ORG_UUID}" \
              -d "${DEPLOY_BODY}")
            CODE2=$(echo "${RESP2}" | tail -1)
            BODY2=$(echo "${RESP2}" | sed '$d')
            echo "HTTP ${CODE2}: ${BODY2}"
            if [ "${CODE2}" = "200" ] || [ "${CODE2}" = "201" ] || [ "${CODE2}" = "202" ]; then
              echo "Deploy succeeded!"; exit 0; fi
          fi

          # Try tenant token as Deploy-Tenant-Authorization (the header DevTools uses)
          echo "=== Attempt 3: DevTools with tenant token as Deploy-Tenant-Authorization ==="
          RESP3=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEV_TOKEN}" \
            -H "Deploy-Tenant-Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
            -d "${DEPLOY_BODY}")
          CODE3=$(echo "${RESP3}" | tail -1)
          BODY3=$(echo "${RESP3}" | sed '$d')
          echo "HTTP ${CODE3}: ${BODY3}"
          if [ "${CODE3}" = "200" ] || [ "${CODE3}" = "201" ] || [ "${CODE3}" = "202" ]; then
            echo "Deploy succeeded!"; exit 0; fi

          # Try the AOS endpoint with tenant token as Authorization (original approach)
          echo "=== Attempt 4: AOS /aos/v1/deploy with tenant + dev tokens ==="
          RESP4=$(curl -s -w "\n%{http_code}" -X POST "https://api.us.wcp.workday.com/aos/v1/deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
            -H "WCP-Authorization: Bearer ${DEV_TOKEN}" \
            -d "$(jq -n --arg versionId "${VERSION_ID}" '{versionId: $versionId}')")
          CODE4=$(echo "${RESP4}" | tail -1)
          BODY4=$(echo "${RESP4}" | sed '$d')
          echo "HTTP ${CODE4}: ${BODY4}"
          if [ "${CODE4}" = "200" ] || [ "${CODE4}" = "201" ] || [ "${CODE4}" = "202" ]; then
            echo "Deploy succeeded!"; exit 0; fi

          echo ""
          echo "All attempts failed. Error messages above indicate what auth is needed."
          echo "Next step: set up WD_TENANT_TOKEN secret with a valid ubc_wcpdev2 tenant token"
          echo "obtained via: wdcli tenant login ubc_wcpdev2"
          exit 1
