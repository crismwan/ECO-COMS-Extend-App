name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Workday Developer OAuth token
        id: auth
        env:
          TENANT: ubc_wcpdev2
        run: |
          # Workday client_credentials requires:
          #   Authorization: ID <base64(clientId:clientSecret)>  (NOT "Basic")
          #   Body: grant_type=client_credentials&tenant_alias=<tenant>
          ENCODED=$(printf '%s:%s' "${{ secrets.WD_CLIENT_ID }}" "${{ secrets.WD_CLIENT_SECRET }}" | base64 -w 0)

          TOKEN_RESPONSE=$(curl -s -X POST "https://auth.api.workday.com/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: ID ${ENCODED}" \
            -d "grant_type=client_credentials&tenant_alias=${TENANT}")

          echo "Token response: ${TOKEN_RESPONSE}"
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')

          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "Developer OAuth failed. Response: ${TOKEN_RESPONSE}"
            exit 1
          fi

          echo "Got Developer access token"
          echo "access_token=${ACCESS_TOKEN}" >> $GITHUB_OUTPUT

      - name: Get latest version and build
        id: build
        env:
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          VERSIONS=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/apps/${APP_ID}/versions?limit=1")
          VERSION_ID=$(echo "${VERSIONS}" | jq -r '.data[0].id // empty')
          if [ -z "${VERSION_ID}" ]; then echo "Could not get version ID"; exit 1; fi
          BUILDS=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/versions/${VERSION_ID}/builds?desc=true&limit=1")
          BUILD_ID=$(echo "${BUILDS}" | jq -r '.data[0].id // empty')
          BUILD_STATUS=$(echo "${BUILDS}" | jq -r '.data[0].status // empty')
          if [ -z "${BUILD_ID}" ]; then echo "Could not get build ID"; exit 1; fi
          echo "version_id=${VERSION_ID}" >> $GITHUB_OUTPUT
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "build_status=${BUILD_STATUS}" >> $GITHUB_OUTPUT

      - name: Wait for build to be ready
        id: wait_build
        env:
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          STATUS="${{ steps.build.outputs.build_status }}"
          MAX_ATTEMPTS=20
          ATTEMPT=0
          while [ "${STATUS}" != "COMPLETE" ] && [ "${STATUS}" != "SUCCESS" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
            BUILD_RESP=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/builds/${BUILD_ID}")
            STATUS=$(echo "${BUILD_RESP}" | jq -r '.status // empty')
            echo "Attempt ${ATTEMPT}: Build status = ${STATUS}"
          done
          if [ "${STATUS}" = "COMPLETE" ] || [ "${STATUS}" = "SUCCESS" ]; then
            echo "Build ready: ${BUILD_ID}"
          else
            echo "Build status: ${STATUS} - attempting deploy anyway"
          fi
          echo "build_ready=true" >> $GITHUB_OUTPUT

      - name: Deploy to ubc_wcpdev2
        env:
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
          TENANT: ubc_wcpdev2
          ORG_ID: 489e5b41-1b3b-4712-9a7e-46ac6456977c
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          DEPLOY_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${APPHUB_BASE}/builds/${BUILD_ID}/deployments" \
            -d "{\"tenantAlias\": \"${TENANT}\", \"organizationId\": \"${ORG_ID}\"}")
          echo "Deploy response: ${DEPLOY_RESPONSE}"
          DEPLOY_ERROR=$(echo "${DEPLOY_RESPONSE}" | jq -r '.error // .detail // empty')
          if [ -n "${DEPLOY_ERROR}" ]; then
            echo "Deploy failed: ${DEPLOY_ERROR}"
            DEPLOY_RESPONSE2=$(curl -s -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              "${APPHUB_BASE}/apps/${APP_ID}/deployments" \
              -d "{\"buildId\": \"${BUILD_ID}\", \"tenantAlias\": \"${TENANT}\", \"organizationId\": \"${ORG_ID}\"}")
            echo "Alternate deploy response: ${DEPLOY_RESPONSE2}"
            DEPLOY_ERROR2=$(echo "${DEPLOY_RESPONSE2}" | jq -r '.error // .detail // empty')
            if [ -n "${DEPLOY_ERROR2}" ]; then echo "Both deploy attempts failed"; exit 1; fi
          fi
          echo "Deploy initiated"

      - name: Verify deploy succeeded
        env:
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          sleep 15
          DEPLOYS=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/apps/${APP_ID}/deployments?limit=1")
          STATUS=$(echo "${DEPLOYS}" | jq -r '.data[0].status // empty')
          echo "Latest deployment status: ${STATUS}"
