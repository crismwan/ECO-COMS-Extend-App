name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Workday WCP OAuth token
        id: auth
        env:
          TENANT: ubc_wcpdev2
        run: |
          # WD_CLIENT_ID is the raw Client ID as shown in the Workday Developer Console
          # Per Workday docs: Authorization: ID base64(clientId:secret)
          ENCODED=$(printf '%s:%s' "${{ secrets.WD_CLIENT_ID }}" "${{ secrets.WD_CLIENT_SECRET }}" | base64 -w 0)

          echo "=== Attempt 1: client_credentials WITHOUT tenant_alias (platform-level scope for apphub) ==="
          TOKEN_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.us.wcp.workday.com/auth/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: ID ${ENCODED}" \
            -d "grant_type=client_credentials")

          HTTP_STATUS=$(echo "${TOKEN_RESPONSE}" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          TOKEN_BODY=$(echo "${TOKEN_RESPONSE}" | sed 's/HTTP_STATUS:[0-9]*//')
          echo "Status: ${HTTP_STATUS}"
          echo "Response: ${TOKEN_BODY}"

          ACCESS_TOKEN=$(echo "${TOKEN_BODY}" | jq -r '.access_token // empty' 2>/dev/null)

          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "=== Attempt 2: client_credentials WITH tenant_alias ==="
            TOKEN_RESPONSE2=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.us.wcp.workday.com/auth/v1/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Authorization: ID ${ENCODED}" \
              -d "grant_type=client_credentials&tenant_alias=${TENANT}")
            HTTP_STATUS2=$(echo "${TOKEN_RESPONSE2}" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
            TOKEN_BODY2=$(echo "${TOKEN_RESPONSE2}" | sed 's/HTTP_STATUS:[0-9]*//')
            echo "Status: ${HTTP_STATUS2}"
            echo "Response: ${TOKEN_BODY2}"
            ACCESS_TOKEN=$(echo "${TOKEN_BODY2}" | jq -r '.access_token // empty' 2>/dev/null)
          fi

          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "All auth attempts failed"
            exit 1
          fi

          # Decode JWT to inspect scopes/claims
          JWT_PAYLOAD=$(echo "${ACCESS_TOKEN}" | cut -d. -f2 | base64 -d 2>/dev/null || echo "${ACCESS_TOKEN}" | cut -d. -f2 | base64 --decode --ignore-garbage 2>/dev/null || echo "decode failed")
          echo "JWT payload: ${JWT_PAYLOAD}"

          echo "Got WCP access token"
          echo "access_token=${ACCESS_TOKEN}" >> $GITHUB_OUTPUT

      - name: Test apphub access
        id: build
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
          ORG_ID: 489e5b41-1b3b-4712-9a7e-46ac6456977c
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"

          echo "=== GET /apps (list all) ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${APPHUB_BASE}/apps" | tail -5

          echo "=== GET /apps by Reference_Id ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${APPHUB_BASE}/apps/Reference_Id=${APP_REF_ID}" | tail -5

          echo "=== GET /organizations/${ORG_ID}/apps ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${APPHUB_BASE}/organizations/${ORG_ID}/apps" | tail -5

          echo "=== GET /apps/${APP_ID}/versions ==="
          VERSIONS=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${APPHUB_BASE}/apps/${APP_ID}/versions?limit=1")
          echo "${VERSIONS}"

          VERSION_BODY=$(echo "${VERSIONS}" | sed 's/HTTP_STATUS:[0-9]*//')
          VERSION_ID=$(echo "${VERSION_BODY}" | jq -r '.data[0].id // empty' 2>/dev/null)

          if [ -z "${VERSION_ID}" ]; then
            echo "Could not get version ID — using hardcoded known version"
            VERSION_ID="c065dfa473afc7a0af785b99b0a252af"
          fi
          echo "Version ID: ${VERSION_ID}"

          BUILDS=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/versions/${VERSION_ID}/builds?desc=true&limit=1")
          echo "Builds: ${BUILDS}"
          BUILD_ID=$(echo "${BUILDS}" | jq -r '.data[0].id // empty')
          BUILD_STATUS=$(echo "${BUILDS}" | jq -r '.data[0].status // empty')

          if [ -z "${BUILD_ID}" ]; then echo "Could not get build ID"; exit 1; fi
          echo "Build ID: ${BUILD_ID} (status: ${BUILD_STATUS})"
          echo "version_id=${VERSION_ID}" >> $GITHUB_OUTPUT
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "build_status=${BUILD_STATUS}" >> $GITHUB_OUTPUT

      - name: Wait for build to be ready
        id: wait_build
        env:
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          STATUS="${{ steps.build.outputs.build_status }}"
          MAX_ATTEMPTS=20
          ATTEMPT=0
          while [ "${STATUS}" != "COMPLETE" ] && [ "${STATUS}" != "SUCCESS" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
            BUILD_RESP=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/builds/${BUILD_ID}")
            STATUS=$(echo "${BUILD_RESP}" | jq -r '.status // empty')
            echo "Attempt ${ATTEMPT}: Build status = ${STATUS}"
          done
          if [ "${STATUS}" = "COMPLETE" ] || [ "${STATUS}" = "SUCCESS" ]; then
            echo "Build ready: ${BUILD_ID}"
          else
            echo "Build status: ${STATUS} - attempting deploy anyway"
          fi
          echo "build_ready=true" >> $GITHUB_OUTPUT

      - name: Deploy to ubc_wcpdev2
        env:
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
          TENANT: ubc_wcpdev2
          ORG_ID: 489e5b41-1b3b-4712-9a7e-46ac6456977c
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          DEPLOY_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${APPHUB_BASE}/builds/${BUILD_ID}/deployments" \
            -d "{\"tenantAlias\": \"${TENANT}\", \"organizationId\": \"${ORG_ID}\"}")
          echo "Deploy response: ${DEPLOY_RESPONSE}"
          DEPLOY_ERROR=$(echo "${DEPLOY_RESPONSE}" | jq -r '.error // .detail // empty')
          if [ -n "${DEPLOY_ERROR}" ]; then
            echo "Deploy failed: ${DEPLOY_ERROR}"
            DEPLOY_RESPONSE2=$(curl -s -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              "${APPHUB_BASE}/apps/${APP_ID}/deployments" \
              -d "{\"buildId\": \"${BUILD_ID}\", \"tenantAlias\": \"${TENANT}\", \"organizationId\": \"${ORG_ID}\"}")
            echo "Alternate deploy response: ${DEPLOY_RESPONSE2}"
            DEPLOY_ERROR2=$(echo "${DEPLOY_RESPONSE2}" | jq -r '.error // .detail // empty')
            if [ -n "${DEPLOY_ERROR2}" ]; then echo "Both deploy attempts failed"; exit 1; fi
          fi
          echo "Deploy initiated"

      - name: Verify deploy succeeded
        env:
          APPHUB_BASE: https://api.us.wcp.workday.com/apphub/v1
          APP_ID: cfd75927b808c1dd99c54b1c7096a142
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          sleep 15
          DEPLOYS=$(curl -s -H "Authorization: Bearer ${TOKEN}" "${APPHUB_BASE}/apps/${APP_ID}/deployments?limit=1")
          STATUS=$(echo "${DEPLOYS}" | jq -r '.data[0].status // empty')
          echo "Latest deployment status: ${STATUS}"
