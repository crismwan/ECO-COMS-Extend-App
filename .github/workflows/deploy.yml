name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Pre-populate wdcli config with developer token
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
          WD_DEV_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          WD_ORG_UUID: ${{ secrets.WD_ORG_UUID }}
        run: |
          set -euo pipefail
          # WD_DEV_TOKEN = wcpAccessToken from interactive `wdcli auth login`
          # WD_ORG_UUID  = organizationUuid from the same config after login
          #
          # How to obtain these (run once locally):
          #   wdcli auth login    (browser PKCE flow)
          #   cat ~/.config/@workday/wdcli/config.json | jq '{wcpAccessToken, organizationUuid}'
          # Then add WD_DEV_TOKEN and WD_ORG_UUID as GitHub repo secrets.

          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          mkdir -p "${WDCLI_CONFIG_DIR}"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"

          # Build config with developer token + org UUID + client credentials
          jq -n \
            --arg devToken "${WD_DEV_TOKEN}" \
            --arg orgUuid "${WD_ORG_UUID}" \
            --arg clientId "${WDCLI_CLIENT_ID}" \
            --arg clientSecret "${WDCLI_CLIENT_SECRET}" \
            '{
              wcpAccessToken: $devToken,
              organizationUuid: $orgUuid,
              clientId: $clientId,
              clientSecret: $clientSecret,
              defaultAccountShortId: "vmzvxm",
              defaultTenantAlias: "ubc_wcpdev2"
            }' > "${CONFIG_FILE}"

          echo "Config written (keys): $(jq -r 'keys | @csv' "${CONFIG_FILE}")"

          # Export org UUID for later steps
          echo "ORG_UUID=${WD_ORG_UUID}" >> $GITHUB_ENV

      - name: Authenticate as system user (for upload)
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail

          echo "=== Running wdcli app upload ==="
          wdcli app upload 2>&1 | tee /tmp/upload-output.txt || true
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt

          # After upload, get the latest version ID via wdcli app versions
          echo "=== Fetching latest version ID ==="
          wdcli app versions "${APP_REF_ID}" --format json 2>&1 | tee /tmp/versions-output.txt || true
          echo "=== Versions output ==="
          cat /tmp/versions-output.txt

          # Extract version ID from versions JSON output
          VERSION_ID=$(jq -r '.[0].versionId // empty' /tmp/versions-output.txt 2>/dev/null)
          if [ -z "${VERSION_ID}" ]; then
            VERSION_ID=$(grep -oE '"versionId"[[:space:]]*:[[:space:]]*"([0-9a-f]{32})"' /tmp/versions-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "${VERSION_ID}" ]; then
            echo "ERROR: Could not determine version ID from upload or versions output"
            exit 1
          fi
          echo "Version ID: ${VERSION_ID}"
          echo "VERSION_ID=${VERSION_ID}" >> $GITHUB_ENV

      - name: Inject tenant access token via client credentials
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "=== Fetching tenant access token via client credentials ==="
          ENCODED=$(printf '%s:%s' "${WDCLI_CLIENT_ID}" "${WDCLI_CLIENT_SECRET}" | base64 -w 0)
          TOKEN_RESPONSE=$(curl -s -X POST "https://auth.api.workday.com/v1/token" \
            -H "Authorization: ID ${ENCODED}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&tenant_alias=${TENANT_ALIAS}")
          echo "Token response keys: $(echo "${TOKEN_RESPONSE}" | jq -r 'keys | @csv' 2>/dev/null || echo 'parse error')"
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "ERROR: No access_token in response: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "Got access token (length=${#ACCESS_TOKEN})"

          # Inject tenant token into wdcli config (preserve existing keys)
          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"
          EXISTING=$(cat "${CONFIG_FILE}")
          echo "${EXISTING}" | jq \
            --arg alias "${TENANT_ALIAS}" \
            --arg token "${ACCESS_TOKEN}" \
            '.wcpTenantAccessToken[$alias] = $token' \
            > "${CONFIG_FILE}"
          echo "Tenant token written."

          # Export for env-var patch
          echo "TENANT_ACCESS_TOKEN=${ACCESS_TOKEN}" >> $GITHUB_ENV

      - name: Patch wdcli to use DevTools deploy path
        run: |
          set -euo pipefail

          # Patch 1: metered-command-C1Iau1Kk.js
          #   fi() — bypass browser PKCE for tenant token, use env var instead
          METERED=$(find /opt/wdcli -name "metered-command-C1Iau1Kk.js" | head -1)
          if [ -z "${METERED}" ]; then
            METERED="$(dirname "$(which wdcli)")/../lib/metered-command-C1Iau1Kk.js"
          fi
          echo "Patching metered bundle: ${METERED}"
          export METERED
          node -e "
            const fs = require('fs');
            const f = process.env.METERED;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'fi=async(e,t)=>{const n=Bt(e,t);';
            const rep = 'fi=async(e,t)=>{if(process.env.WDCLI_TENANT_TOKEN){return process.env.WDCLI_TENANT_TOKEN;}const n=Bt(e,t);';
            if (!c.includes(old)) { console.error('ERROR: fi patch target not found'); process.exit(1); }
            fs.writeFileSync(f, c.replace(old, rep));
            console.log('Patch 1 (tenant token env var): OK');
          "

          # Patch 2: commands/index.js
          #   Force hasPermission('agentbuilder.agent.write') → true so wdcli
          #   always takes the DevTools path (B) instead of the AOS path (C).
          #   AOS path crashes in CI because the _octopaas-scoped system-user
          #   token is rejected by AOS.
          #   commands/index.js lives in the same lib/ dir as metered-command-*.js
          CMDS="$(dirname "${METERED}")/commands/index.js"
          echo "Patching commands bundle: ${CMDS}"
          export CMDS
          node -e "
            const fs = require('fs');
            const f = process.env.CMDS;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'await a.hasPermission(this,\"agentbuilder.agent.write\",i.organizationUuid)';
            const rep = '(true /* CI: force DevTools path */)';
            if (!c.includes(old)) { console.error('ERROR: hasPermission patch target not found'); process.exit(1); }
            fs.writeFileSync(f, c.replace(old, rep));
            console.log('Patch 2 (force DevTools path): OK');
          "

          # Patch 3: commands/index.js — log the actual HTTP error from DevTools
          node -e "
            const fs = require('fs');
            const f = process.env.CMDS;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'catch(n){a.Output.error(\`Error deploying \${e.versionId} to \${e.tenant.lookupAlias}.\`);const t=n instanceof Error&&\"commonRequestID\"in n?n.commonRequestID:\"\";return{success:!1,versionId:e.versionId,commonRequestId:t,appId:e.appUuid,buildId:\"\",asorRegistrationSucceeded:!1,asorRegistrationErrors:[]}}';
            const rep = 'catch(n){console.error(\"[DIAG] DevTools deploy error:\",n&&n.message,\"status:\",n&&n.status,\"body:\",JSON.stringify(n&&(n.response||n.body||n.data)));a.Output.error(\`Error deploying \${e.versionId} to \${e.tenant.lookupAlias}.\`);const t=n instanceof Error&&\"commonRequestID\"in n?n.commonRequestID:\"\";return{success:!1,versionId:e.versionId,commonRequestId:t,appId:e.appUuid,buildId:\"\",asorRegistrationSucceeded:!1,asorRegistrationErrors:[]}}';
            if (!c.includes(old)) { console.error('WARN: catch patch target not found (skipping)'); }
            else { fs.writeFileSync(f, c.replace(old, rep)); console.log('Patch 3 (log DevTools error): OK'); }
          "

      - name: Deploy to ubc_wcpdev2 via wdcli
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_TENANT_TOKEN: ${{ env.TENANT_ACCESS_TOKEN }}
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          APP_REF_ID=ecocomsphase_xclw_cm_sync2_vmzvxm
          echo "Deploying ${APP_REF_ID} version ${VERSION_ID} to ${TENANT_ALIAS}"
          echo "WDCLI_TENANT_TOKEN length: ${#WDCLI_TENANT_TOKEN}"
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}"
