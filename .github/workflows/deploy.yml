name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail

          # Stamp the version field with the git short SHA so each commit
          # produces a unique version ID (prevents wdcli from reusing an
          # already-deployed version, which causes its response parser to crash)
          GIT_SHA="${GITHUB_SHA:0:8}"
          jq --arg v "1.0.0-${GIT_SHA}" '.version = $v' appManifest.json > /tmp/manifest-stamped.json
          cp /tmp/manifest-stamped.json appManifest.json
          echo "Stamped appManifest.json version: $(jq -r .version appManifest.json)"

          echo "=== Running wdcli app upload ==="
          wdcli app upload 2>&1 | tee /tmp/upload-output.txt
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt

      - name: Inject tenant access token via client credentials
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # Fetch a fresh tenant access token using client credentials grant
          echo "=== Fetching tenant access token via client credentials ==="
          ENCODED=$(printf '%s:%s' "${WDCLI_CLIENT_ID}" "${WDCLI_CLIENT_SECRET}" | base64 -w 0)
          TOKEN_RESPONSE=$(curl -s -X POST "https://auth.api.workday.com/v1/token" \
            -H "Authorization: ID ${ENCODED}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&tenant_alias=${TENANT_ALIAS}")
          echo "Token response keys: $(echo "${TOKEN_RESPONSE}" | jq -r 'keys | @csv' 2>/dev/null || echo 'parse error')"
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "ERROR: No access_token in response: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "Got access token (length=${#ACCESS_TOKEN})"

          # Inject token into wdcli config
          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          mkdir -p "${WDCLI_CONFIG_DIR}"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"

          # Read existing config or start fresh
          if [ -f "${CONFIG_FILE}" ]; then
            EXISTING=$(cat "${CONFIG_FILE}")
          else
            EXISTING='{}'
          fi

          # Merge in the tenant access token
          echo "${EXISTING}" | jq \
            --arg alias "${TENANT_ALIAS}" \
            --arg token "${ACCESS_TOKEN}" \
            '.wcpTenantAccessToken[$alias] = $token' \
            > "${CONFIG_FILE}"
          echo "Tenant token written to ${CONFIG_FILE}"
          echo "=== wdcli tenant token (verify) ==="
          wdcli tenant token 2>&1 || echo "wdcli tenant token command failed"

      - name: Deploy to ubc_wcpdev2
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          echo "=== Running wdcli app deploy ==="
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}" --latest-version --format json \
            2>&1 | tee /tmp/deploy-output.txt || true

          echo "=== Deploy output ==="
          cat /tmp/deploy-output.txt

          # Fail the step if deploy explicitly errored (not just a wdcli response-parse crash)
          if grep -q "Cannot read properties of undefined" /tmp/deploy-output.txt; then
            # wdcli crashed parsing the API response — this is a known wdcli bug.
            # The deploy was initiated; check if it actually succeeded by looking at
            # whether the 'Initiating app deploy' line appeared (meaning the API call went through).
            if grep -q "Initiating app deploy" /tmp/deploy-output.txt; then
              echo "Deploy was initiated (API call succeeded). wdcli crashed on response parsing — known bug."
              echo "Check Workday console to verify deployment status."
              # Consider this a success — the API accepted the deploy request
            else
              echo "ERROR: Deploy failed to initiate"
              exit 1
            fi
          elif grep -qE "^Error" /tmp/deploy-output.txt; then
            echo "ERROR: Deploy returned an error"
            exit 1
          else
            echo "Deploy completed successfully"
          fi
