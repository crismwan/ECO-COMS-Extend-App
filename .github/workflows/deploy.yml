name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Authenticate as system user
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          wdcli auth login --system-user
          wdcli whoami

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euxo pipefail

          echo "=== Running wdcli app upload ==="
          wdcli app upload 2>&1 | tee /tmp/upload-output.txt || true
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt

          # After upload, get the latest version ID via wdcli app versions
          # This is more reliable than parsing upload output (which may not print
          # the version ID when re-uploading identical content)
          echo "=== Fetching latest version ID ==="
          wdcli app versions "${APP_REF_ID}" --format json 2>&1 | tee /tmp/versions-output.txt || true
          echo "=== Versions output ==="
          cat /tmp/versions-output.txt

          # Extract version ID from versions JSON output
          # wdcli app versions returns [{versionId, appId, name, status, ...}]
          VERSION_ID=$(jq -r '.[0].versionId // empty' /tmp/versions-output.txt 2>/dev/null)
          if [ -z "${VERSION_ID}" ]; then
            # Fall back to grepping for 32-char hex from versions output
            VERSION_ID=$(grep -oE '"versionId"[[:space:]]*:[[:space:]]*"([0-9a-f]{32})"' /tmp/versions-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "${VERSION_ID}" ]; then
            echo "ERROR: Could not determine version ID from upload or versions output"
            exit 1
          fi
          echo "Version ID: ${VERSION_ID}"
          echo "VERSION_ID=${VERSION_ID}" >> $GITHUB_ENV

      - name: Inject tenant access token via client credentials
        env:
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "=== Fetching tenant access token via client credentials ==="
          ENCODED=$(printf '%s:%s' "${WDCLI_CLIENT_ID}" "${WDCLI_CLIENT_SECRET}" | base64 -w 0)
          TOKEN_RESPONSE=$(curl -s -X POST "https://auth.api.workday.com/v1/token" \
            -H "Authorization: ID ${ENCODED}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&tenant_alias=${TENANT_ALIAS}")
          echo "Token response keys: $(echo "${TOKEN_RESPONSE}" | jq -r 'keys | @csv' 2>/dev/null || echo 'parse error')"
          ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "ERROR: No access_token in response: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "Got access token (length=${#ACCESS_TOKEN})"

          # Inject token into wdcli config
          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          mkdir -p "${WDCLI_CONFIG_DIR}"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"
          if [ -f "${CONFIG_FILE}" ]; then
            EXISTING=$(cat "${CONFIG_FILE}")
          else
            EXISTING='{}'
          fi
          echo "${EXISTING}" | jq \
            --arg alias "${TENANT_ALIAS}" \
            --arg token "${ACCESS_TOKEN}" \
            '.wcpTenantAccessToken[$alias] = $token' \
            > "${CONFIG_FILE}"
          echo "Tenant token written to ${CONFIG_FILE}"

          # Export tenant token for use in the next step
          echo "TENANT_ACCESS_TOKEN=${ACCESS_TOKEN}" >> $GITHUB_ENV

      - name: Deploy to ubc_wcpdev2 via REST API
        env:
          APP_UUID: cfd75927b808c1dd99c54b1c7096a142
          TENANT_ALIAS: ubc_wcpdev2
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          WDCLI_CONFIG="${HOME}/.config/@workday/wdcli/config.json"

          # Developer access token from wdcli config (written by wdcli auth login)
          DEV_TOKEN=$(jq -r '.wcpAccessToken // empty' "${WDCLI_CONFIG}" 2>/dev/null)
          if [ -z "${DEV_TOKEN}" ]; then
            echo "ERROR: wcpAccessToken not found in wdcli config"
            jq -r 'keys[]' "${WDCLI_CONFIG}"
            exit 1
          fi
          echo "Got developer access token (length=${#DEV_TOKEN})"

          # Derive API gateway from wcpRegion: "scylla:us" → "api.us.wcp.workday.com"
          WCP_REGION=$(jq -r '.wcpRegion // empty' "${WDCLI_CONFIG}" 2>/dev/null)
          echo "wcpRegion: ${WCP_REGION}"
          REGION_CODE="${WCP_REGION#scylla:}"
          GATEWAY="api.${REGION_CODE}.wcp.workday.com"
          echo "Derived API gateway: ${GATEWAY}"

          mkdir -p /tmp/diag
          echo "=== Diagnosing token types ==="
          # Decode JWT payload for both tokens to understand what they contain
          decode_jwt() {
            local token="$1"
            local payload
            payload=$(echo "${token}" | cut -d'.' -f2)
            # Add padding
            local len=${#payload}
            local pad=$(( (4 - len % 4) % 4 ))
            local padded="${payload}$(python3 -c "print('='*${pad})")"
            echo "${padded}" | base64 -d 2>/dev/null || echo "decode_failed"
          }

          echo "--- Developer token claims ---"
          DEV_CLAIMS=$(decode_jwt "${DEV_TOKEN}")
          DEV_JSON=$(echo "${DEV_CLAIMS}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(json.dumps(d, indent=2))" 2>/dev/null || echo "parse failed")
          echo "${DEV_JSON}"
          echo "${DEV_JSON}" > /tmp/diag/dev_token_claims.json

          echo "--- Tenant token claims (from auth.api.workday.com) ---"
          TENANT_CLAIMS=$(decode_jwt "${TENANT_ACCESS_TOKEN}")
          TENANT_JSON=$(echo "${TENANT_CLAIMS}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(json.dumps(d, indent=2))" 2>/dev/null || echo "parse failed")
          echo "${TENANT_JSON}"
          echo "${TENANT_JSON}" > /tmp/diag/tenant_token_claims.json

          # Write summary for step summary
          {
            echo "## JWT Claims"
            echo "### Developer Token"
            echo '```json'
            echo "${DEV_JSON}"
            echo '```'
            echo "### Tenant Token (auth.api.workday.com)"
            echo '```json'
            echo "${TENANT_JSON}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "=== Attempt 1: AOS deploy with tenant token as Authorization ==="
          echo "  (AosConnector layout: Authorization=tenant, WCP-Authorization=dev)"
          DEPLOY_URL="https://${GATEWAY}/aos/v1/deploy"
          DEPLOY_BODY=$(jq -n --arg versionId "${VERSION_ID}" '{versionId: $versionId}')

          RESP1=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
            -H "WCP-Authorization: Bearer ${DEV_TOKEN}" \
            -d "${DEPLOY_BODY}")
          CODE1=$(echo "${RESP1}" | tail -1)
          BODY1=$(echo "${RESP1}" | sed '$d')
          echo "HTTP ${CODE1}: ${BODY1}"

          if [ "${CODE1}" = "200" ] || [ "${CODE1}" = "201" ] || [ "${CODE1}" = "202" ]; then
            echo "Deploy succeeded!"
            exit 0
          fi

          echo ""
          echo "=== Attempt 2: AOS deploy with dev token as Authorization ==="
          echo "  (reversed layout: Authorization=dev, WCP-Authorization=tenant)"
          RESP2=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEV_TOKEN}" \
            -H "WCP-Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
            -d "${DEPLOY_BODY}")
          CODE2=$(echo "${RESP2}" | tail -1)
          BODY2=$(echo "${RESP2}" | sed '$d')
          echo "HTTP ${CODE2}: ${BODY2}"

          if [ "${CODE2}" = "200" ] || [ "${CODE2}" = "201" ] || [ "${CODE2}" = "202" ]; then
            echo "Deploy succeeded!"
            exit 0
          fi

          echo ""
          echo "=== Attempt 3: AOS deploy with only dev token ==="
          RESP3=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEV_TOKEN}" \
            -d "${DEPLOY_BODY}")
          CODE3=$(echo "${RESP3}" | tail -1)
          BODY3=$(echo "${RESP3}" | sed '$d')
          echo "HTTP ${CODE3}: ${BODY3}"

          if [ "${CODE3}" = "200" ] || [ "${CODE3}" = "201" ] || [ "${CODE3}" = "202" ]; then
            echo "Deploy succeeded!"
            exit 0
          fi

          echo ""
          echo "=== Attempt 4: AOS deploy with tenantAlias in body ==="
          DEPLOY_BODY4=$(jq -n \
            --arg versionId "${VERSION_ID}" \
            --arg tenantAlias "${TENANT_ALIAS}" \
            '{versionId: $versionId, tenantAlias: $tenantAlias}')
          RESP4=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
            -H "WCP-Authorization: Bearer ${DEV_TOKEN}" \
            -d "${DEPLOY_BODY4}")
          CODE4=$(echo "${RESP4}" | tail -1)
          BODY4=$(echo "${RESP4}" | sed '$d')
          echo "HTTP ${CODE4}: ${BODY4}"

          if [ "${CODE4}" = "200" ] || [ "${CODE4}" = "201" ] || [ "${CODE4}" = "202" ]; then
            echo "Deploy succeeded!"
            exit 0
          fi

          echo ""
          echo "=== Attempt 5: WCP-SDK client_credentials via api.us.wcp.workday.com ==="
          echo "  (wdcli fetches system user token from api.{region}.wcp.workday.com/v2/token)"
          ENCODED=$(printf '%s:%s' "${WDCLI_CLIENT_ID}" "${WDCLI_CLIENT_SECRET}" | base64 -w 0)
          SDK_TOKEN_RESP=$(curl -s -X POST "https://api.us.wcp.workday.com/v2/token" \
            -H "Authorization: ID ${ENCODED}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")
          echo "SDK token response keys: $(echo "${SDK_TOKEN_RESP}" | jq -r 'keys | @csv' 2>/dev/null)"
          SDK_DEV_TOKEN=$(echo "${SDK_TOKEN_RESP}" | jq -r '.access_token // empty')
          if [ -n "${SDK_DEV_TOKEN}" ]; then
            echo "Got SDK dev token (length=${#SDK_DEV_TOKEN})"
            echo "--- SDK dev token claims ---"
            decode_jwt "${SDK_DEV_TOKEN}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(json.dumps(d, indent=2))" 2>/dev/null || true

            RESP5=$(curl -s -w "\n%{http_code}" -X POST "${DEPLOY_URL}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${TENANT_ACCESS_TOKEN}" \
              -H "WCP-Authorization: Bearer ${SDK_DEV_TOKEN}" \
              -d "${DEPLOY_BODY}")
            CODE5=$(echo "${RESP5}" | tail -1)
            BODY5=$(echo "${RESP5}" | sed '$d')
            echo "HTTP ${CODE5}: ${BODY5}"
            if [ "${CODE5}" = "200" ] || [ "${CODE5}" = "201" ] || [ "${CODE5}" = "202" ]; then
              echo "Deploy succeeded!"
              exit 0
            fi
          else
            echo "Could not get SDK token: ${SDK_TOKEN_RESP}"
          fi

          echo ""
          echo "All deploy attempts failed. Check JWT claims above to diagnose."
          echo "Token endpoint comparison:"
          echo "  wdcli uses: https://api.us.wcp.workday.com/v2/token (OctopaasConnector)"
          echo "  we used:    https://auth.api.workday.com/v1/token"

          # Write results summary to file for artifact upload
          {
            echo "ATTEMPT_1: ${CODE1:-n/a} - ${BODY1:-n/a}"
            echo "ATTEMPT_2: ${CODE2:-n/a} - ${BODY2:-n/a}"
            echo "ATTEMPT_3: ${CODE3:-n/a} - ${BODY3:-n/a}"
            echo "ATTEMPT_4: ${CODE4:-n/a} - ${BODY4:-n/a}"
          } >> /tmp/diag/attempt_results.txt
          exit 1

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics
          path: /tmp/diag/
          if-no-files-found: ignore
