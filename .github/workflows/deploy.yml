name: Deploy to Workday Extend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WDCLI from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WDCLI v1.9.43 is stored as a release asset on this repo
          # To update: download Linux x64 from https://developer.workday.com/downloads
          # then upload it as a release asset tagged "wdcli-v1.9.43"
          mkdir -p /opt/wdcli-download
          gh release download wdcli-v1.9.43 \
            --repo crismwan/ECO-COMS-Extend-App \
            --pattern "wdcli-installer-linux-x64-*.tar.gz" \
            --dir /opt/wdcli-download

          mkdir -p /opt/wdcli
          tar xzvf /opt/wdcli-download/wdcli-installer-linux-x64-*.tar.gz -C /opt/wdcli

          WDCLI_BIN=$(find /opt/wdcli -name "wdcli" -type f | head -1)
          if [ -z "${WDCLI_BIN}" ]; then
            echo "ERROR: Could not find wdcli binary after extraction"
            exit 1
          fi
          chmod +x "${WDCLI_BIN}"
          echo "$(dirname ${WDCLI_BIN})" >> $GITHUB_PATH

      - name: Pre-populate wdcli config with developer token
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
          WD_DEV_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          WD_ORG_UUID: ${{ secrets.WD_ORG_UUID }}
        run: |
          set -euo pipefail
          # WD_DEV_TOKEN = wcpTenantAccessToken["ubc_wcpdev2"] from interactive `wdcli app deploy`
          # This is the PKCE user token scoped to ubc_wcpdev2 (aud: wd, tenant: ubc_wcpdev2).
          # It is written by wdcli when you run `wdcli app deploy <ref>` interactively and
          # complete the browser login for the ubc_wcpdev2 tenant.
          # Obtain it: run `wdcli app deploy ecocomsphase_xclw_cm_sync2_vmzvxm` locally,
          # log in via browser, then copy config.json > wcpTenantAccessToken > ubc_wcpdev2.
          # Token TTL is ~8h; refresh by repeating the interactive deploy and updating the secret.

          WDCLI_CONFIG_DIR="${HOME}/.config/@workday/wdcli"
          mkdir -p "${WDCLI_CONFIG_DIR}"
          CONFIG_FILE="${WDCLI_CONFIG_DIR}/config.json"

          # Build config with tenant token in the correct slot + client credentials
          # wcpTenantAccessToken["ubc_wcpdev2"] is what AOS /deploy uses as Authorization: Bearer
          jq -n \
            --arg devToken "${WD_DEV_TOKEN}" \
            --arg orgUuid "${WD_ORG_UUID}" \
            --arg clientId "${WDCLI_CLIENT_ID}" \
            --arg clientSecret "${WDCLI_CLIENT_SECRET}" \
            '{
              wcpTenantAccessToken: {"ubc_wcpdev2": $devToken},
              organizationUuid: $orgUuid,
              clientId: $clientId,
              clientSecret: $clientSecret,
              defaultAccountShortId: "vmzvxm",
              defaultTenantAlias: "ubc_wcpdev2"
            }' > "${CONFIG_FILE}"

          echo "Config written (keys): $(jq -r 'keys | @csv' "${CONFIG_FILE}")"

          # Decode JWT expiry to check token freshness
          JWT_PAYLOAD=$(echo "${WD_DEV_TOKEN}" | cut -d'.' -f2)
          PADDED=$(echo "${JWT_PAYLOAD}" | tr '_-' '/+' | awk '{n=length($0)%4; if(n==2) print $0"=="; else if(n==3) print $0"="; else print $0}')
          EXP=$(echo "${PADDED}" | base64 -d 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('exp','no exp'))" 2>/dev/null || echo "parse-error")
          NOW=$(date +%s)
          if [ "${EXP}" = "parse-error" ] || [ "${EXP}" = "no exp" ]; then
            echo "WD_DEV_TOKEN JWT exp: could not decode"
          elif [ "${EXP}" -lt "${NOW}" ]; then
            echo "WARNING: WD_DEV_TOKEN EXPIRED (exp=${EXP}, now=${NOW}, expired $((NOW - EXP))s ago)"
            echo "ACTION: run 'wdcli app deploy ecocomsphase_xclw_cm_sync2_vmzvxm' locally, log in, update WD_DEV_TOKEN secret"
            exit 1
          else
            echo "WD_DEV_TOKEN valid (exp=${EXP}, expires in $((EXP - NOW))s)"
          fi

          # Export org UUID for later steps
          echo "ORG_UUID=${WD_ORG_UUID}" >> $GITHUB_ENV

      - name: Authenticate as system user (for upload)
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Runs wdcli auth login --system-user, which overwrites wcpAccessToken
          # in config with the OctopaAS client-credentials token.
          # This token works for upload (/apps/source/archive) and getOrganizations,
          # but NOT for the DevTools deploy endpoint (/apps/{uuid}/deploy).
          # We restore the PKCE WD_DEV_TOKEN into wcpAccessToken after upload.
          wdcli auth login --system-user
          wdcli whoami

      - name: Validate presentation files before upload
        run: python3 .github/scripts/validate_pmd.py

      - name: Upload app to App Hub
        env:
          APP_REF_ID: ecocomsphase_xclw_cm_sync2_vmzvxm
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -uo pipefail

          echo "=== Running wdcli app upload ==="
          # Disable -e so we can capture the exit code ourselves
          set +e
          echo "." | wdcli app upload 2>&1 | tee /tmp/upload-output.txt
          UPLOAD_EXIT=${PIPESTATUS[1]}
          set -e
          echo "=== Upload output ==="
          cat /tmp/upload-output.txt
          echo "=== Upload exit code: ${UPLOAD_EXIT} ==="
          if [ "${UPLOAD_EXIT}" -ne 0 ]; then
            echo "ERROR: wdcli app upload failed with exit code ${UPLOAD_EXIT}"
            {
              echo "## Upload Failure"
              echo "Exit code: ${UPLOAD_EXIT}"
              echo "### Upload output:"
              echo '```'
              cat /tmp/upload-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi

          # First try to extract version ID directly from upload output
          VERSION_ID=$(grep -oE '"versionId"[[:space:]]*:[[:space:]]*"([0-9a-f]{32})"' /tmp/upload-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)
          if [ -z "${VERSION_ID}" ]; then
            VERSION_ID=$(grep -oE 'versionId[[:space:]]*=[[:space:]]*([0-9a-f]{32})' /tmp/upload-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "${VERSION_ID}" ]; then
            # Parse from "Initiated build <buildId> for version <versionId>" line
            VERSION_ID=$(grep -oE 'for version [0-9a-f]{32}' /tmp/upload-output.txt | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          echo "=== VERSION_ID from upload output: '${VERSION_ID}' ==="

          # If we still don't have VERSION_ID, try wdcli app versions (with set +e)
          if [ -z "${VERSION_ID}" ]; then
            echo "=== Fetching latest version ID via wdcli app versions ==="
            set +e
            wdcli app versions "${APP_REF_ID}" --format json 2>&1 | tee /tmp/versions-output.txt
            VERSIONS_EXIT=${PIPESTATUS[0]}
            set -e
            echo "=== Versions exit code: ${VERSIONS_EXIT} ==="
            VERSION_ID=$(jq -r '.[0].versionId // empty' /tmp/versions-output.txt 2>/dev/null) || true
            if [ -z "${VERSION_ID}" ]; then
              VERSION_ID=$(grep -oE '"versionId"[[:space:]]*:[[:space:]]*"([0-9a-f]{32})"' /tmp/versions-output.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1) || true
            fi
          fi

          if [ -z "${VERSION_ID}" ]; then
            echo "ERROR: Could not determine version ID from upload or versions output"
            {
              echo "## Upload Failure Diagnosis"
              echo "### Upload output:"
              echo '```'
              cat /tmp/upload-output.txt 2>/dev/null || echo "(empty)"
              echo '```'
              echo "### Versions output:"
              echo '```'
              cat /tmp/versions-output.txt 2>/dev/null || echo "(empty)"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY || true
            exit 1
          fi
          echo "Version ID: ${VERSION_ID}"
          echo "VERSION_ID=${VERSION_ID}" >> $GITHUB_ENV

      - name: Restore tenant token for AOS deploy
        env:
          WD_DEV_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          WD_WCP_TOKEN: ${{ secrets.WD_WCP_TOKEN }}
          WD_ORG_UUID: ${{ secrets.WD_ORG_UUID }}
        run: |
          set -euo pipefail
          # WD_DEV_TOKEN = wcpTenantAccessToken["ubc_wcpdev2"]  (aud: wd,  tenant: ubc_wcpdev2)
          # WD_WCP_TOKEN = wcpAccessToken                       (aud: wcp, tenant: _octopaaas)
          #
          # AOS /deploy needs both:
          #   Authorization: Bearer <wcpTenantAccessToken>   → used as Auth header by wdcli
          #   WCP-Auth: <wcpAccessToken>                     → platform-level header
          #
          # After wdcli auth login --system-user, wcpAccessToken holds the system-user
          # OctopaAS token — which is NOT accepted by AOS. We replace both slots with
          # the PKCE user tokens from the interactive config.json the operator pasted.
          CONFIG_FILE="${HOME}/.config/@workday/wdcli/config.json"

          # Build deploy-ready WCP_TOKEN: fall back to WD_DEV_TOKEN if WD_WCP_TOKEN unset
          PLATFORM_TOKEN="${WD_WCP_TOKEN:-${WD_DEV_TOKEN}}"

          jq --arg tenantTok "${WD_DEV_TOKEN}" \
             --arg wcpTok "${PLATFORM_TOKEN}" \
             --arg org "${WD_ORG_UUID}" \
            '.wcpTenantAccessToken["ubc_wcpdev2"] = $tenantTok
            | .wcpAccessToken = $wcpTok
            | .organizationUuid = $org' \
            "${CONFIG_FILE}" > /tmp/config-restored.json
          mv /tmp/config-restored.json "${CONFIG_FILE}"
          echo "Restored: wcpTenantAccessToken.ubc_wcpdev2 (len=${#WD_DEV_TOKEN}), wcpAccessToken (len=${#PLATFORM_TOKEN})"
          echo "Config keys: $(jq -r 'keys | @csv' "${CONFIG_FILE}")"

      - name: Patch wdcli to use DevTools deploy path
        env:
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # Patch 1: metered-command-C1Iau1Kk.js
          #   fi() — bypass browser PKCE for tenant token, use env var instead
          METERED=$(find /opt/wdcli -name "metered-command-C1Iau1Kk.js" | head -1)
          if [ -z "${METERED}" ]; then
            METERED="$(dirname "$(which wdcli)")/../lib/metered-command-C1Iau1Kk.js"
          fi
          echo "Patching metered bundle: ${METERED}"
          export METERED
          node -e "
            const fs = require('fs');
            const f = process.env.METERED;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'fi=async(e,t)=>{const n=Bt(e,t);';
            const rep = 'fi=async(e,t)=>{if(process.env.WDCLI_TENANT_TOKEN){return process.env.WDCLI_TENANT_TOKEN;}const n=Bt(e,t);';
            if (!c.includes(old)) { console.error('ERROR: fi patch target not found'); process.exit(1); }
            fs.writeFileSync(f, c.replace(old, rep));
            console.log('Patch 1 (tenant token env var): OK');
          "

          # Patch 2: commands/index.js
          #   Force hasPermission('agentbuilder.agent.write') → false so wdcli
          #   always takes the AOS path (C) instead of the DevTools path (B).
          #   ECO-COMS is a standard Extend app; the correct deploy endpoint is
          #   POST /aos/v1/deploy, not the DevTools /devtools/v1/apps/{uuid}/deploy.
          #   commands/index.js lives in the same lib/ dir as metered-command-*.js
          CMDS="$(dirname "${METERED}")/commands/index.js"
          echo "Patching commands bundle: ${CMDS}"
          export CMDS
          node -e "
            const fs = require('fs');
            const f = process.env.CMDS;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'await a.hasPermission(this,\"agentbuilder.agent.write\",i.organizationUuid)';
            const rep = '(false /* CI: force AOS deploy path, not DevTools */)';
            if (!c.includes(old)) { console.error('ERROR: hasPermission patch target not found'); process.exit(1); }
            fs.writeFileSync(f, c.replace(old, rep));
            console.log('Patch 2 (force AOS deploy path via hasPermission=false): OK');
          "

          # Patch 3: metered-command-C1Iau1Kk.js
          #   Bypass getUserAccounts (OctopaAS getOrganizations) entirely when
          #   WDCLI_ORG_UUID is set. getOrganizations needs the OctopaAS token,
          #   but for deploy we've already restored the PKCE token into wcpAccessToken.
          #   We know the org from the diagnostic run: 489e5b41-1b3b-4712-9a7e-46ac6456977c
          node -e "
            const fs = require('fs');
            const f = process.env.METERED;
            let c = fs.readFileSync(f, 'utf8');
            const old = 'async getUserAccounts(t){const n=await L(t);return Ee(t,{accessToken:n,version:\"v2\"}).getOrganizations()}';
            const rep = 'async getUserAccounts(t){if(process.env.WDCLI_ORG_UUID){const uuid=process.env.WDCLI_ORG_UUID;console.error(\"[CI] Bypassing getOrganizations, using WDCLI_ORG_UUID:\",uuid);return{total:1,userUuid:\"ci\",userOrganizations:[{organizationUuid:uuid,organizationShortId:\"vmzvxm\",organizationName:\"The University Of British Columbia\",organizationType:\"Customer\",tenantPrefix:\"ubc\",associationType:\"PRIMARY\",region:\"scylla:us\"}]};}const n=await L(t);return Ee(t,{accessToken:n,version:\"v2\"}).getOrganizations()}';
            if (!c.includes(old)) { console.error('ERROR: getUserAccounts patch target not found'); process.exit(1); }
            fs.writeFileSync(f, c.replace(old, rep));
            console.log('Patch 3 (bypass getOrganizations): OK');
          "

          # Patches 4+5: stored as base64 to avoid YAML/bash escaping issues with backticks
          # Patch 4: Bypass ue() = organizationPermissions (hits /users/self/permissions)
          # Patch 5: Bypass Ve() = getTenantsList (hits OctopaasConnector.getTenantsForOrg)
          echo "" | base64 -d > /tmp/patch4.js
          echo "" | base64 -d > /tmp/patch5.js
          # Patch 6: wcp-sdk — log URL, both auth headers (Authorization + WCP-Authorization),
          #   request body, and response on any 401, to diagnose token issues
          WCP_SDK=$(find /opt/wdcli -path "*/wcp-sdk/dist/index.js" | head -1)
          export WCP_SDK
          echo "Patching wcp-sdk: ${WCP_SDK}"
          echo "" | base64 -d > /tmp/patch6.js
          # Patch 7: verifyCliAccess (Tr) — also calls getOrganizations directly
          echo "" | base64 -d > /tmp/patch7.js
          # Patch 8: q()/getApplication — bypasses AppHub lookup (system-user token rejected)
          echo "" | base64 -d > /tmp/patch8.js
          # Patch 9: Te()/version lookup — bypasses AppHub /versions call (system-user token rejected)
          echo "" | base64 -d > /tmp/patch9.js
          node /tmp/patch4.js
          node /tmp/patch5.js
          node /tmp/patch6.js
          node /tmp/patch7.js
          node /tmp/patch8.js
          node /tmp/patch9.js

          # Patch 10: commands/index.js
          #   Add 'org-id' header to the DevTools deploy POST.
          #   ServiceApiConnector.execute() destructures {baseURL,params,configHeaders,...}
          #   but NOT orgUuid, so the org-id header is never set by the generic post().
          #   DevToolsConnector.getHeaders() sets org-id but is only called by named methods.
          #   Fix: explicitly include 'org-id': e.orgUuid in the headers object passed to post().
          echo "" | base64 -d > /tmp/patch10.js
          node /tmp/patch10.js

          # Patch 11: metered-command bundle
          #   Cloudflare bot protection rejects the deploy POST because Node.js native fetch
          #   sends no User-Agent header by default. DevToolsConnector only sets Content-Type.
          #   Without a User-Agent, Cloudflare sees a bot and returns 401 with empty body and
          #   no WWW-Authenticate (confirmed from response headers in CI output).
          #   Fix: call setDefaultHeader("User-Agent","wdcli/1.9.43") on the connector in Pt()
          #   before attachAuthToken(), making CI requests indistinguishable from interactive CLI.
          echo "" | base64 -d > /tmp/patch11.js
          node /tmp/patch11.js

          # Patch 12 removed: was swapping Authorization to ID scheme for AOS deploy.
          # Root cause was wrong token type — WD_DEV_TOKEN is now correctly set to
          # wcpTenantAccessToken["ubc_wcpdev2"] (aud: wd, tenant: ubc_wcpdev2), not wcpAccessToken.
          # No interception needed; wdcli reads the token from config naturally.

      - name: Deploy to ubc_wcpdev2 via wdcli
        env:
          TENANT_ALIAS: ubc_wcpdev2
          # AOS deploy path (Patch 2 forces hasPermission=false → C class):
          #   POST /aos/v1/deploy with:
          #   1. Authorization: Bearer <tenantBearerToken>
          #      = getValidatedTenantAccessToken() = WDCLI_TENANT_TOKEN (Patch 1)
          #      = WD_DEV_TOKEN = wcpTenantAccessToken["ubc_wcpdev2"]
          #        (PKCE user token, aud: wd, tenant: ubc_wcpdev2, sub: lmcneil)
          #   2. WCP-Authorization: Bearer <wcpAccessToken>
          #      = getWcpAccessToken() → config file wcpAccessToken
          #      = WD_WCP_TOKEN = wcpAccessToken from interactive config.json
          #        (platform token, aud: wcp, tenant: _octopaaas)
          WDCLI_TENANT_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          WDCLI_ORG_UUID: ${{ secrets.WD_ORG_UUID }}
          WDCLI_APP_UUID: cfd75927b808c1dd99c54b1c7096a142
          WDCLI_VERSION_ID: ${{ env.VERSION_ID }}
          WDCLI_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WDCLI_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
          WD_WCP_TOKEN: ${{ secrets.WD_WCP_TOKEN }}
        run: |
          set -euo pipefail
          APP_REF_ID=ecocomsphase_xclw_cm_sync2_vmzvxm
          echo "Deploying ${APP_REF_ID} version ${VERSION_ID} to ${TENANT_ALIAS}"
          echo "WDCLI_TENANT_TOKEN length: ${#WDCLI_TENANT_TOKEN}"
          wdcli app deploy "${APP_REF_ID}" --tenant-alias "${TENANT_ALIAS}"
