name: E2E tests (no deploy)

# Runs the live tests against the app already deployed in ubc_wcpdev2, without uploading or
# deploying. Use it to rerun tests, or to clean up test data.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "smoke = read-only; full = smoke + create/inactivate a TEST org; cleanup-dry-run = list test data; cleanup-apply = inactivate test orgs, delete test requests and audit entries"
        type: choice
        options: [smoke, full, cleanup-dry-run, cleanup-apply]
        default: smoke
      also:
        description: "cleanup only: extra record ids (comma-separated) to treat as test data"
        required: false
        default: ""
      effective:
        description: "cleanup only: inactivation effective date yyyy-MM-dd (default today, falling back to tomorrow)"
        required: false
        default: ""
      only:
        description: "cleanup only: limit inactivation to these org codes (comma-separated)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e
        env:
          WD_DEV_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          TASK: ${{ github.event.inputs.task }}
          ALSO: ${{ github.event.inputs.also }}
          EFFECTIVE: ${{ github.event.inputs.effective }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          case "${TASK}" in
            smoke)           node test/e2e.js --suite smoke ;;
            full)            node test/e2e.js --suite full ;;
            cleanup-dry-run) node test/e2e.js --suite cleanup --also "${ALSO}" ;;
            cleanup-apply)   node test/e2e.js --suite cleanup --apply --also "${ALSO}" ${EFFECTIVE:+--effective "$EFFECTIVE"} ${ONLY:+--only "$ONLY"} ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.event.inputs.task }}
          path: test/e2e-results.json
          if-no-files-found: ignore
