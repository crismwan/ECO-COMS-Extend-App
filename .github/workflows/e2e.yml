name: Tests (no deploy)

# Runs the live tests against the app already deployed in ubc_wcpdev2, without uploading or
# deploying. Use it to rerun tests, or to clean up test data.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "static = repo checks; smoke = read-only; full = smoke + write tests; isu = ISU lockdown (only once ISU writes are live); cleanup-dry-run / cleanup-apply = list / remove TEST data; repair-dry-run / repair-apply = one-off data fixes; publish-template = rebuild the pre-filled Excel template from Workday and publish it to Download Template"
        type: choice
        options: [static, smoke, full, isu, seconduser, cleanup-dry-run, cleanup-apply, repair-dry-run, repair-apply, purge-dry-run, purge-apply, demo-seed, datacheck, probe, bulkvalidate, bulkapply, subflows, graphql, eventlinks, timing, seed-apps-dry-run, seed-apps-apply, pattern-guard, org-guard, gateway, prompts, possearch, postree, publish-template]
        default: smoke
      also:
        description: "cleanup only: extra record ids (comma-separated) to treat as test data"
        required: false
        default: ""
      effective:
        description: "cleanup only: inactivation effective date yyyy-MM-dd (default today, falling back to tomorrow)"
        required: false
        default: ""
      only:
        description: "cleanup only: limit inactivation to these org codes (comma-separated)"
        required: false
        default: ""
      repair_flags:
        description: "repair only: extra flags, e.g. --backfill-wids"
        required: false
        default: ""
      unassign:
        description: "repair only: position ID (e.g. P-00001) to remove from the test role"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Python for the template builder
        if: github.event.inputs.task == 'publish-template'
        run: pip install --quiet openpyxl

      - name: Run e2e
        env:
          WD_DEV_TOKEN: ${{ secrets.WD_DEV_TOKEN }}
          WD_SECOND_TOKEN: ${{ secrets.WD_SECOND_TOKEN }}
          TASK: ${{ github.event.inputs.task }}
          ALSO: ${{ github.event.inputs.also }}
          EFFECTIVE: ${{ github.event.inputs.effective }}
          ONLY: ${{ github.event.inputs.only }}
          UNASSIGN: ${{ github.event.inputs.unassign }}
        run: |
          # Secrets pasted from config.json can carry the JSON quotes or a newline; a JWT has neither, so drop them.
          for v in WD_DEV_TOKEN WD_WCP_TOKEN WDCLI_TENANT_TOKEN; do if [ -n "${!v:-}" ]; then export "$v=$(printf '%s' "${!v}" | tr -d '[:space:]\"')"; fi; done
          case "${TASK}" in
            static|smoke|full|isu|seconduser|datacheck|probe|bulkvalidate|bulkapply|subflows|graphql|eventlinks|timing) node test/run-tests.js "${TASK}" ;;
            cleanup-dry-run) node test/run-tests.js cleanup --also "${ALSO}" ;;
            cleanup-apply)   node test/run-tests.js cleanup --apply --also "${ALSO}" ${EFFECTIVE:+--effective "$EFFECTIVE"} ${ONLY:+--only "$ONLY"} ;;
            repair-dry-run)  node test/run-tests.js repair ${{ github.event.inputs.repair_flags }} ${UNASSIGN:+--unassign "$UNASSIGN"} ${ONLY:+--drop-audit "$ONLY"} ;;
            repair-apply)    node test/run-tests.js repair --apply ${{ github.event.inputs.repair_flags }} ${UNASSIGN:+--unassign "$UNASSIGN"} ${ONLY:+--drop-audit "$ONLY"} ;;
            seed-apps-dry-run) node test/run-tests.js seedapps ;;
            seed-apps-apply)   node test/run-tests.js seedapps --apply ;;
            pattern-guard)     node test/run-tests.js patternguard ;;
            org-guard)         node test/run-tests.js orgguard ;;
            gateway)           node test/run-tests.js gateway ;;
            prompts)           node test/run-tests.js prompts ;;
            possearch)         node test/run-tests.js possearch ;;
            postree)           node test/run-tests.js postree ;;
            purge-dry-run)   node test/run-tests.js purge ;;
            purge-apply)     node test/run-tests.js purge --apply ;;
            demo-seed)       node test/run-tests.js demoseed ${EFFECTIVE:+--effective "$EFFECTIVE"} ;;
            publish-template) node tools/publish_template.js ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.task }}
          path: test/results.json
          if-no-files-found: ignore
